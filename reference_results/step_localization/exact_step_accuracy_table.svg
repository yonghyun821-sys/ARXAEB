  <line x1="740" y1="65" x2="740" y2="230" class="line"/>
  <line x1="955" y1="65" x2="955" y2="230" class="line"/>
  <line x1="35" y1="120" x2="1165" y2="120" class="line"/>
  <line x1="35" y1="175" x2="1165" y2="175" class="line"/>

  <text x="140" y="98" text-anchor="middle" class="header">Dataset</text>
