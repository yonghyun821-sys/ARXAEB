  <text x="635" y="98" text-anchor="middle" class="header">Own Taxonomy</text>
  <text x="847.5" y="98" text-anchor="middle" class="header">Foreign Taxonomy</text>
  <text x="1060" y="98" text-anchor="middle" class="header">Merged Taxonomy</text>

